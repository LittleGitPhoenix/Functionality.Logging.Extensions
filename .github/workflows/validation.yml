###############################
## PHOENIX validation v0.6.0 ##
###############################
name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:

  validate:
    name: Validate repository before allowing PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './src'
    steps:
      
      # Checkout the repository
      - name: <Setup> Checkout code
        uses: actions/checkout@v4
            
      # Validate project versions
      - name: <Test> Check project versions (SemVer enforcement for C#, VB, F#)
        id: check-project-versions
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Checking project versions..."
          $semverRegex = '^[0-9]+\.[0-9]+\.[0-9]+$'
          $errorCount = 0
          
          $projectFiles = Get-ChildItem -Path . -Recurse -Include *.csproj, *.vbproj, *.fsproj | Where-Object { $_.FullName -notlike "*\Tests\*" }
          
          foreach ($file in $projectFiles) {
            $content = Get-Content -Path $file.FullName -Raw
            if ($content -match '<Version>([^<]+)</Version>') {
              $version = $matches[1]
              if ($version -notmatch $semverRegex) {
                Write-Host "❌ Project $($file.FullName) has invalid version: $version"                
                $errorCount++
              }
              else {
                Write-Host "✅ Project $($file.FullName) has valid SemVer: $version"
              }
            }
            else {
              Write-Host "❌ Project $($file.FullName) has no <Version> tag defined."
              $errorCount++
            }
          }
          
          if ($errorCount -gt 0) {
            Write-Host ""
            Write-Host "❌ Found $errorCount project version error(s)."
            exit 1
          }
          else {
            Write-Host ""
            Write-Host "✅ All project versions are valid."
          }

      # Validate package versions
      - name: <Test> Check for prerelease packages
        id: check-package-versions
        continue-on-error: true
        run: |
          dotnet list package > packages.txt
          echo "Checking for prerelease packages..."
          error_count=0
          while IFS= read -r line; do
            if echo "$line" | grep -qE -- '-(alpha|beta|rc|preview)'; then
              echo "❌ Prerelease package detected: $line"
              ((error_count++))
            fi
          done < packages.txt
          if [ $error_count -gt 0 ]; then
            echo "❌ Found $error_count prerelease package(s). Please use stable versions."
            exit 1
          else
            echo "✅ All packages are stable releases."
          fi

      # Fail workflow if any validation failed
      - name: <Test> Fail if validation errors occurred
        if: steps.check-project-versions.outcome == 'failure' || steps.check-package-versions.outcome == 'failure'
        run: |
          echo "❌ Validation of project and package versions failed. Please review the errors above."
          exit 1

      # Install .NET SDK
      - name: <Setup> Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: <Build> Restore dependencies
        run: dotnet restore

      # Build the solution
      - name: <Build> Build solution
        run: dotnet build --configuration Release --no-restore

      # Run tests with coverage
      - name: <Test> Run tests with TRX + coverage
        id: run-tests
        run: dotnet test --configuration Release --no-build \
              --logger "trx;LogFileName=test_results.trx" \
              /p:CollectCoverage=true \
              /p:CoverletOutput=TestResults/coverage/ \
              /p:CoverletOutputFormat=cobertura
      
      # Publish test results
      - name: <Test> Publish test results
        id: publish-tests
        uses: dorny/test-reporter@v1
        if: steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure'
        with:
          name: Unit Tests
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      # Publish coverage summary
      - name: <Test> Publish coverage summary
        id: publish-coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure'
        with:
          filename: '**/TestResults/coverage/coverage.cobertura.xml'
          badge: true
          fail_below_min: false
          thresholds: '80 90'