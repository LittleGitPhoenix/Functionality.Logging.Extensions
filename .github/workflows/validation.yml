###############################
## PHOENIX validation v0.1.0 ##
###############################
name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  validate-packages-and-projects:
    name: Validate Packages and Project Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check project versions (SemVer enforcement for C#, VB, F#)
        run: |
          echo "Checking project versions..."
          semver_regex='^[0-9]+\.[0-9]+\.[0-9]+$'
          for file in $(find . -type f \( -name '*.csproj' -o -name '*.vbproj' -o -name '*.fsproj' \)); do
            version=$(grep -oPm1 "(?<=<Version>)[^<]+" "$file" || echo "none")
            if [ "$version" = "none" ]; then
              echo "❌ Project $file has no <Version> tag defined."
              exit 1
            fi
            if [[ ! "$version" =~ $semver_regex ]]; then
              echo "❌ Project $file has invalid version: $version"
              echo "   Allowed format: MAJOR.MINOR.PATCH (e.g., 1.2.3)"
              exit 1
            else
              echo "✅ Project $file has valid SemVer: $version"
            fi
          done

      - name: Check for prerelease packages
        run: |
          dotnet list ./YourSolution.sln package > packages.txt
          echo "Checking for prerelease packages..."
          if grep -E -- '-(alpha|beta|rc|preview)' packages.txt; then
            echo "❌ Prerelease packages detected. Please use stable versions."
            exit 1
          else
            echo "✅ All packages are stable releases."
          fi

  run-tests:
    name: Run Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: validate-packages-and-projects
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests with TRX + coverage
        run: dotnet test --configuration Release --no-build \
              --logger "trx;LogFileName=test_results.trx" \
              /p:CollectCoverage=true \
              /p:CoverletOutput=TestResults/coverage/ \
              /p:CoverletOutputFormat=cobertura

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      - name: Publish coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/TestResults/coverage/coverage.cobertura.xml'
          badge: true
          fail_below_min: false
          thresholds: '80 90'