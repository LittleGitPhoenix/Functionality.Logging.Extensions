###############################
## PHOENIX validation v0.5.0 ##
###############################
name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:

  validate:
    name: Validate repository before allowing PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './src'
    steps:
      
      # Checkout the repository
      - name: <Setup> Checkout code
        uses: actions/checkout@v4
      
      # Validate project versions
      - name: <Test> Check project versions (SemVer enforcement for C#, VB, F#)
        id: check-project-versions
        run: |
          echo "Checking project versions..."
          semver_regex='^[0-9]+\.[0-9]+\.[0-9]+$'
          for file in $(find . -type f \( -name '*.csproj' -o -name '*.vbproj' -o -name '*.fsproj' \)); do
            version=$(grep -oPm1 "(?<=<Version>)[^<]+" "$file" || echo "none")
            if [ "$version" = "none" ]; then
              echo "❌ Project $file has no <Version> tag defined."
              exit 1
            fi
            if [[ ! "$version" =~ $semver_regex ]]; then
              echo "❌ Project $file has invalid version: $version"
              echo "   Allowed format: MAJOR.MINOR.PATCH (e.g., 1.2.3)"
              exit 1
            else
              echo "✅ Project $file has valid SemVer: $version"
            fi
          done

      # Validate package versions
      - name: <Test> Check for prerelease packages
        id: check-package-versions
        run: |
          dotnet list package > packages.txt
          echo "Checking for prerelease packages..."
          if grep -E -- '-(alpha|beta|rc|preview)' packages.txt; then
            echo "❌ Prerelease packages detected. Please use stable versions."
            exit 1
          else
            echo "✅ All packages are stable releases."
          fi

      # Install .NET SDK
      - name: <Setup> Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: <Build> Restore dependencies
        run: dotnet restore

      # Build the solution
      - name: <Build> Build solution
        run: dotnet build --configuration Release --no-restore

      # Run tests with coverage
      - name: <Test> Run tests with TRX + coverage
        id: run-tests
        run: dotnet test --configuration Release --no-build \
              --logger "trx;LogFileName=test_results.trx" \
              /p:CollectCoverage=true \
              /p:CoverletOutput=TestResults/coverage/ \
              /p:CoverletOutputFormat=cobertura
      
      # Publish test results
      - name: <Test> Publish test results
        id: publish-tests
        uses: dorny/test-reporter@v1
        if: steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure'
        with:
          name: Unit Tests
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      # Publish coverage summary
      - name: <Test> Publish coverage summary
        id: publish-coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure'
        with:
          filename: '**/TestResults/coverage/coverage.cobertura.xml'
          badge: true
          fail_below_min: false
          thresholds: '80 90'